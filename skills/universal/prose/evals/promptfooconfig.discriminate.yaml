# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Style discrimination, human versus generated prose.
#
# Separate from the rewrite suite because it asks a different question and its
# cases are real internal prose that stays gitignored under corpus/.
#
# Build the set first.
#   tools/build-discrimination-set.py --n 40
#
# Run one arm at a time.
#   npx promptfoo@latest eval -c promptfooconfig.discriminate.yaml --filter-pattern marked
#   npx promptfoo@latest eval -c promptfooconfig.discriminate.yaml --filter-pattern stripped
#
# The marked arm leaves punctuation in place, so a model can answer by counting
# em-dashes. The stripped arm removes em-dashes, semicolons and colons from both
# classes. The gap between the two arms is how much of the score was mechanical.
description: Style discrimination, human versus generated

prompts:
  - file://prompts/discriminate.txt

providers:
  - id: exec:./providers/deployed.sh
    label: deployed

# No shared graders. Each row carries its own label assertion, and the rewrite
# suite's banned-literal checks would fire on the passage rather than the answer.
tests:
  - file://corpus/discriminate-marked.csv
  - file://corpus/discriminate-stripped.csv
