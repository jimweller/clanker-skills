# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# The launder loop. AI tell in, rewrite, fresh judge out.
#
# Every passage is a mined Confluence paragraph ranked high on mechanical
# markers, so the input is known-generated by construction and needs no label.
# The question is whether the contract turns it into prose a fresh judge calls
# human, and the target is 90 percent or better.
#
# Two providers run the same passages. judge-only classifies the paragraph as
# written and gives the floor. rewrite-then-judge rewrites it first. The gap
# between the two arms is what the contract buys.
#
# Build the set first.
#   tools/build-launder-set.py --n 60
#   npx promptfoo@latest eval -c promptfooconfig.launder.yaml
#
# Keep the intermediate rewrites for reading.
#   LAUNDER_KEEP_REWRITE=corpus/rewrites npx promptfoo@latest eval -c promptfooconfig.launder.yaml
#
# Known limitation. The judge loads the same global instructions the rewriter
# does, so it is a contract-aware judge rather than a naive reader. It runs in a
# separate process with no history and never learns the text was rewritten, but
# it is not an independent observer.
description: Launder loop, AI tell to rewrite to verdict

commandLineOptions:
  repeat: 3
  maxConcurrency: 8

prompts:
  - file://prompts/passage.txt

providers:
  - id: exec:./providers/judge-only.sh
    label: baseline
  - id: exec:./providers/rewrite-then-judge.sh
    label: laundered

# No shared graders. Each row asserts on the one-word verdict, and the rewrite
# suite's banned-literal checks would fire on the passage rather than the answer.
tests:
  - file://corpus/launder.csv
